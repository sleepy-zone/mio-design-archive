<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霧島澪 · 姿势与服装设计档案</title>
<style>
:root{
  --paper:#f2eee4; --paper-2:#e9e3d5; --ink:#1b1a17; --muted:#7d7668;
  --line:#d5ccba; --accent:#9a3b2c; --moss:#4b5344; --white:#fbf9f3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
a{color:inherit}
button{font-family:inherit;color:inherit}

/* top */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 40px;border-bottom:1px solid var(--line)}
.brand{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
.brand b{color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:24px}
.top-x{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.14em;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:2px}
.dl{position:relative}
.dl-btn{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid var(--ink);padding:0 0 2px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.dl-btn .caret{font-size:9px;color:var(--accent);transition:transform .2s}
.dl.open .dl-btn .caret{transform:rotate(180deg)}
.dl-menu{position:absolute;right:0;top:calc(100% + 14px);width:252px;background:var(--white);border:1px solid var(--line);box-shadow:0 22px 48px rgba(27,26,23,.14);padding:10px;display:none;z-index:80}
.dl.open .dl-menu{display:block}
.dl-hd{font-family:"Helvetica Neue",Arial,sans-serif;font-size:8.5px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;padding:4px 8px 8px}
.dl-menu a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 8px;text-decoration:none;border:0;font-size:12.5px;letter-spacing:.02em;color:var(--ink)}
.dl-menu a:hover{background:var(--paper-2)}
.dl-menu a em{font-style:normal;font-family:"Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.04em;color:var(--muted)}
.dl-note{margin:8px 8px 2px;font-size:9.5px;line-height:1.7;color:var(--muted)}

/* hero */
.hero{padding:56px 40px 34px;max-width:1460px;margin:0 auto;position:relative}
.hero .jp{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(42px,6.2vw,84px);line-height:.98;margin:18px 0 6px;font-weight:500;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:clamp(15px,1.5vw,19px);color:var(--moss);letter-spacing:.18em;margin-bottom:0}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(242,238,228,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toolbar-in{max-width:1460px;margin:0 auto;padding:14px 40px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px}
.seg button{border:1px solid var(--line);background:transparent;padding:8px 16px;font-size:12px;letter-spacing:.12em;cursor:pointer;transition:.2s}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);padding:4px 0;min-width:260px}
.search input{border:0;background:transparent;outline:0;font-family:inherit;font-size:13px;width:100%;letter-spacing:.04em}
.search svg{width:14px;height:14px;flex:none}
.viewswitch{border:0;background:none;font-size:12px;letter-spacing:.1em;border-bottom:1px solid var(--ink);padding:2px 0;cursor:pointer}

/* volume grid */
main{max-width:1460px;margin:0 auto;padding:38px 40px 80px}
.count-line{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px 30px}
.card{cursor:pointer;position:relative}
.card figure{margin:0;overflow:hidden;background:var(--paper-2);position:relative;aspect-ratio:1/1}
.card figure img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .7s cubic-bezier(.16,1,.3,1), filter .3s}
.card:hover figure img{transform:scale(1.035)}
.badge{position:absolute;top:14px;left:14px;background:rgba(27,26,23,.86);color:var(--white);font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.16em;padding:6px 10px}
.card .meta{padding:16px 0 0}
.eyebrow{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;letter-spacing:.26em;color:var(--accent);text-transform:uppercase;margin-bottom:7px}
.card h3{font-size:21px;font-weight:500;margin:0 0 4px;letter-spacing:.04em}
.card .en{font-size:12px;color:var(--muted);font-style:italic;letter-spacing:.04em}
.card .note{font-size:12.5px;line-height:1.8;color:#514c43;margin:10px 0 8px;min-height:44px}
.card .foot{display:flex;justify-content:space-between;font-family:"Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--line);padding-top:9px;text-transform:uppercase}

/* flat */
.flatgroup{margin-bottom:46px}
.flathead{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.flathead h3{margin:0;font-size:20px;font-weight:500}
.flathead span{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.18em;color:var(--muted)}
.flathead a{margin-left:auto;font-size:11px;letter-spacing:.08em;color:var(--muted);text-decoration:none}
.flatgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.tile{text-decoration:none;display:block;position:relative;border:0;background:none;padding:0;text-align:left;cursor:zoom-in;font:inherit;color:inherit;width:100%}
.tile img{width:100%;height:auto;object-fit:contain;display:block;background:var(--paper-2);transition:.25s}
.tile:hover img{filter:brightness(.92)}
.tile .no{position:absolute;top:5px;left:6px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;background:rgba(27,26,23,.75);color:#fff;padding:2px 5px}
.tile .nm{font-size:10.5px;line-height:1.45;margin-top:6px;color:#413d35;letter-spacing:.01em}
.tile .id{font-family:"Helvetica Neue",Arial,sans-serif;font-size:8.5px;letter-spacing:.12em;color:var(--muted)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,19,16,.72);z-index:60;display:none;backdrop-filter:blur(3px)}
.overlay.open{display:block}
.modal{position:fixed;inset:4vh 4vw;background:var(--paper);z-index:61;display:none;overflow:hidden;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.modal.open{display:grid}
.modal .sheetpane{background:#e7e1d3;display:flex;align-items:center;justify-content:center;padding:30px;position:relative;overflow:hidden}
.modal .sheetpane img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.modal .content{overflow-y:auto;padding:38px 40px 50px;position:relative}
.modal h2{font-size:34px;font-weight:500;margin:6px 0 2px;letter-spacing:.03em}
.modal .men{font-style:italic;color:var(--muted);font-size:13px;margin-bottom:14px}
.modal .mnote{font-size:13px;line-height:1.95;color:#4c473e;max-width:560px;border-left:2px solid var(--accent);padding-left:14px;margin:16px 0 20px}
.modal .mmeta{display:flex;gap:24px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:22px}
.modal .mmeta a{color:var(--accent);text-decoration:none}
.close{position:absolute;top:14px;right:16px;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:#57524a;z-index:2}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mitem{border:0;background:none;padding:0;text-align:left;cursor:zoom-in}
.mitem img{width:100%;height:auto;object-fit:contain;display:block;background:#e7e1d3}
.mitem .n{font-size:12.5px;margin-top:7px;line-height:1.4}
.mitem .n b{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:500;color:var(--accent);margin-right:5px;font-size:11px}
.mitem .it{font-family:"Helvetica Neue",Arial,sans-serif;font-size:8.5px;letter-spacing:.14em;color:var(--muted);margin-top:2px}
.mitem .tg{font-size:10px;color:var(--moss);margin-top:3px}
.mitem .zh{font-size:10.5px;line-height:1.55;color:#5d574c;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(15,14,12,.94);display:none;align-items:center;justify-content:center;padding:4vh 4vw}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:92vh;object-fit:contain}
.lightbox .lbclose{position:absolute;top:16px;right:22px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer}


/* item detail */
.itemview{position:fixed;inset:0;z-index:90;background:rgba(18,17,14,.86);display:none;align-items:center;justify-content:center;padding:3vh 3vw}
.itemview.open{display:flex}
.iv-panel{background:var(--paper);width:min(1180px,100%);max-height:94vh;display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden;position:relative}
.iv-media{background:#e7e1d3;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0}
.iv-media img{max-width:100%;max-height:86vh;object-fit:contain}
.iv-info{padding:34px 34px 28px;overflow-y:auto}
.iv-info h3{font-size:30px;font-weight:500;margin:6px 0 2px;letter-spacing:.02em}
.iv-id{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:14px;text-transform:uppercase}
.iv-zh{font-size:14px;line-height:1.95;color:#3f3b33;margin:0 0 18px}
.iv-block{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.iv-label{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.iv-block pre{white-space:pre-wrap;word-break:break-word;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:11.5px;line-height:1.75;background:var(--white);border:1px solid var(--line);padding:10px 12px;margin:8px 0;max-height:150px;overflow:auto}
.iv-actions{display:flex;gap:8px;flex-wrap:wrap}
.iv-actions button{border:1px solid var(--ink);background:var(--ink);color:var(--white);padding:8px 12px;font-size:10.5px;letter-spacing:.08em;cursor:pointer}
.iv-actions button.ghost{background:transparent;color:var(--ink)}
.iv-note{font-size:10.5px;color:var(--muted);line-height:1.8;margin-top:12px}
.iv-promptzh{font-size:12.5px;line-height:1.95;color:#3f3b33;background:var(--paper-2);border-left:2px solid var(--accent);padding:8px 12px;margin:0 0 10px}
.iv-promptzh b{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:8.5px;font-weight:400;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:3px}
.iv-tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.iv-tag{border:1px solid var(--line);background:var(--white);padding:3px 7px;font-size:11px;line-height:1.5;white-space:nowrap}
.iv-tag em{font-style:normal;font-family:"Helvetica Neue",Arial,sans-serif;font-size:9.5px;color:var(--muted);letter-spacing:.02em;margin-right:5px}
.ivclose{position:absolute;top:10px;right:14px;font-size:26px;line-height:1;border:0;background:none;cursor:pointer;color:#57524a;z-index:2}
@media(max-width:900px){.iv-panel{grid-template-columns:1fr;overflow-y:auto}.iv-media{max-height:40vh}.iv-media img{max-height:38vh}.iv-info{padding:22px 20px 30px}}

@media(max-width:1100px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .flatgrid{grid-template-columns:repeat(6,1fr)}
  .modal{grid-template-columns:1fr;inset:2vh 2vw}
  .modal .sheetpane{max-height:38vh}
}
@media(max-width:680px){
  .hero,.toolbar-in,main,.topbar{padding:16px 20px}
  .grid{grid-template-columns:1fr;gap:34px}
  .flatgrid{grid-template-columns:repeat(3,1fr)}
  .modal h2{font-size:26px}
  .modal .content{padding:26px 22px 40px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">MIO <b>/</b> DESIGN ARCHIVE <b>/</b> 2026</div>
  <div class="topbar-right">
    <div class="dl" id="dl">
      <button class="dl-btn" id="dlBtn" aria-expanded="false" aria-controls="dlMenu">整库下载 <span class="caret">↓</span></button>
      <div class="dl-menu" id="dlMenu" role="dialog" aria-label="整库下载">
        <div class="dl-hd">整库打包 · 321 张图</div>
        <a href="https://pan.baidu.com/s/1Vplb3Q-_xBgZwga1nCc0kw?pwd=c584" target="_blank" rel="noopener"><span>百度网盘</span><em>提取码 c584</em></a>
        <a href="https://pan.quark.cn/s/ae4b422f141d?pwd=ACVp" target="_blank" rel="noopener"><span>夸克网盘</span><em>提取码 ACVp</em></a>
        <a href="https://drive.uc.cn/s/9b911ad86d044?public=1" target="_blank" rel="noopener"><span>UC 网盘</span><em>无需提取码</em></a>
        <p class="dl-note">32 张九宫格 + 288 张单件图 + 总览与清单，约 12 MB。单张图仍可在详情面板另存。</p>
      </div>
    </div>
    <a class="top-x" href="https://x.com/Mio_2am" target="_blank" rel="noopener">@Mio_2am ↗</a>
  </div>
</div>

<header class="hero">
  <div class="jp">Kirishima Mio · Pose / Cloth / Hair Studies</div>
  <h1>霧島澪 <em>设计档案</em></h1>
  <div class="sub">姿势 · 服装 · 发型 —— 九宫格设计库</div>
</header>

<div class="toolbar">
  <div class="toolbar-in">
    <div class="seg" id="seg">
      <button data-series="all" aria-pressed="true">全部</button>
      <button data-series="hair" aria-pressed="false">发型</button>
      <button data-series="cloth" aria-pressed="false">服装</button>
      <button data-series="pose" aria-pressed="false">姿势</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16l5 5"/></svg>
      <input id="q" type="search" placeholder="搜索名称 / 中文说明 / 提示词 / 编号，例如 Kick、蕾丝、P-08" autocomplete="off">
    </div>
    <button class="viewswitch" id="viewswitch">平铺 270 件 ↓</button>
  </div>
</div>

<main>
  <div class="count-line" id="count-line"></div>
  <section id="volumes" class="grid"></section>
  <section id="flat" style="display:none"></section>
</main>

<div class="overlay" id="overlay"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="itemview" id="itemview"></div>
<div class="lightbox" id="lightbox"><button class="lbclose" aria-label="关闭">×</button><img alt=""></div>

<script src="data.js"></script>
<script src="tagdict.js"></script>
<script>
const LIB = window.MIO_LIB;
const SERIES = {pose:'姿势',cloth:'服装',hair:'发型'};
const $ = (s,r=document)=>r.querySelector(s);
const state = {series:'all', q:'', mode:'volumes'};
const SERIES_ORDER = {hair:0, cloth:1, pose:2};
const ORDERED = [...LIB.volumes].sort((a,b)=> (SERIES_ORDER[a.series]-SERIES_ORDER[b.series]) || (a.vol-b.vol));

function matches(v){
  if(state.series!=='all' && v.series!==state.series) return false;
  const q=state.q.trim().toLowerCase();
  if(!q) return true;
  const hay=[v.title,v.theme_zh,v.theme_en,v.note,v.tags.join(' '),v.items.map(i=>[i.name,i.id,i.zh||'',i.prompt||'',i.tags.join(' ')].join(' ')).join(' ')].join(' ').toLowerCase();
  return hay.includes(q);
}
function filtered(){ return ORDERED.filter(matches); }

function render(){
  const vols=filtered();
  const items=vols.reduce((n,v)=>n+v.count,0);
  $('#count-line').textContent = state.mode==='volumes'
    ? `${String(vols.length).padStart(2,'0')} 卷 · ${String(items).padStart(3,'0')} 件`
    : `${String(vols.length).padStart(2,'0')} 卷 · ${String(items).padStart(3,'0')} 件 · 平铺视图`;
  $('#volumes').style.display = state.mode==='volumes'?'grid':'none';
  $('#flat').style.display = state.mode==='flat'?'block':'none';
  if(state.mode==='volumes') renderVolumes(vols); else renderFlat(vols);
  $('#viewswitch').textContent = state.mode==='volumes'
    ? `平铺 ${items} 件 ↓` : `回到分卷 ↑`;
}

function renderVolumes(vols){
  const wrap=$('#volumes'); wrap.innerHTML='';
  vols.forEach(v=>{
    const c=document.createElement('article'); c.className='card'; c.tabIndex=0;
    c.innerHTML=`
      <figure><img loading="lazy" src="${v.sheet}" alt="${v.title}"><span class="badge">VOL.${String(v.vol).padStart(2,'0')}</span></figure>
      <div class="meta">
        <div class="eyebrow">${SERIES[v.series]} SERIES · ${v.count} ITEMS</div>
        <h3>${v.title.replace('Mio’s','')}</h3>
        <div class="en">${v.theme_en} · ${v.theme_zh}</div>
        <p class="note">${v.note||''}</p>
        <div class="foot"><span>${v.date}</span><span>查看 9 件 →</span></div>
      </div>`;
    const open=()=>openModal(v);
    c.onclick=open;
    c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open();} };
    wrap.appendChild(c);
  });
}

function renderFlat(vols){
  const wrap=$('#flat'); wrap.innerHTML='';
  vols.forEach(v=>{
    const g=document.createElement('section'); g.className='flatgroup';
    g.innerHTML=`<div class="flathead"><h3>${v.title}</h3><span>${v.theme_zh} · ${v.date}</span><a href="${v.url}" target="_blank" rel="noopener">原帖 ↗</a></div>`;
    const grid=document.createElement('div'); grid.className='flatgrid';
    v.items.forEach(it=>{
      const a=document.createElement('button'); a.className='tile'; a.type='button';
      a.innerHTML=`<span class="no">${String(it.no).padStart(2,'0')}</span><img loading="lazy" src="${it.tile}" alt="${it.name}"><div class="nm">${it.name}</div><div class="id">${it.id}</div>`;
      a.onclick=()=>openItem(v, it);
      grid.appendChild(a);
    });
    g.appendChild(grid); wrap.appendChild(g);
  });
}

function openModal(v){
  const m=$('#modal');
  m.innerHTML=`
    <div class="sheetpane"><img src="${v.sheet}" alt="${v.title}" style="cursor:zoom-in"></div>
    <div class="content">
      <button class="close" aria-label="关闭">×</button>
      <div class="eyebrow">${SERIES[v.series]} SERIES · VOL.${String(v.vol).padStart(2,'0')}</div>
      <h2>${v.title}</h2>
      <div class="men">${v.theme_en} · ${v.theme_zh}</div>
      <div class="mnote">${v.note||''}</div>
      <div class="mmeta"><span>${v.date}</span><span>${v.count} 件</span><a href="${v.url}" target="_blank" rel="noopener">在 X 查看原帖 ↗</a></div>
      <div class="mgrid"></div>
    </div>`;
  const grid=$('.mgrid',m);
  v.items.forEach(it=>{
    const b=document.createElement('button'); b.className='mitem';
    b.innerHTML=`<img loading="lazy" src="${it.tile}" alt="${it.name}"><div class="n"><b>${String(it.no).padStart(2,'0')}</b>${it.name}</div>${it.zh?`<div class="zh">${it.zh}</div>`:''}<div class="it">${it.id}</div>${it.tags.length?`<div class="tg">${it.tags.join(' · ')}</div>`:''}`;
    b.onclick=()=>openItem(v, it);
    grid.appendChild(b);
  });
  $('.sheetpane img',m).onclick=()=>lightbox(v.sheet, v.title);
  $('.close',m).onclick=closeModal;
  $('#overlay').classList.add('open'); m.classList.add('open'); document.body.classList.add('locked');
}
function closeModal(){ $('#overlay').classList.remove('open'); $('#modal').classList.remove('open'); document.body.classList.remove('locked'); }
$('#overlay').onclick=closeModal;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ const iv=$('#itemview'); if(iv.classList.contains('open')) iv.classList.remove('open'); else { closeModal(); $('#lightbox').classList.remove('open'); } }
  if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
});

// 整库下载（网盘）
const dl=$('#dl'), dlBtn=$('#dlBtn');
function closeDl(){ dl.classList.remove('open'); dlBtn.setAttribute('aria-expanded','false'); }
dlBtn.onclick=e=>{ e.stopPropagation(); const open=dl.classList.toggle('open'); dlBtn.setAttribute('aria-expanded', open?'true':'false'); };
document.addEventListener('click',e=>{ if(!dl.contains(e.target)) closeDl(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDl(); });

const NEG = 'lowres, worst quality, low quality, bad anatomy, bad hands, extra fingers, missing fingers, text, watermark, signature, jpeg artifacts, multiple views';
const PREFIX = 'masterpiece, best quality, very aesthetic, absurdres';
async function copyText(text, btn, orig){
  try { await navigator.clipboard.writeText(text); }
  catch(e) {
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove();
  }
  if(btn){ btn.textContent='已复制'; setTimeout(()=>btn.textContent=orig, 1400); }
}
function openItem(v, it){
  const iv=$('#itemview');
  iv.innerHTML=`
    <div class="iv-panel">
      <button class="ivclose" aria-label="关闭">×</button>
      <div class="iv-media"><img src="${it.tile}" alt="${it.name}"></div>
      <div class="iv-info">
        <div class="eyebrow">${SERIES[v.series]} · VOL.${String(v.vol).padStart(2,'0')} · ${v.theme_en}</div>
        <h3>${it.name}</h3>
        <div class="iv-id">${it.id} · No.${String(it.no).padStart(2,'0')}</div>
        <p class="iv-zh">${it.zh||''}</p>
        <div class="iv-block">
          <div class="iv-label">Prompt · 中英对照</div>
          <pre class="iv-prompt"></pre>
          <div class="iv-promptzh"><b>中文对照</b><span></span></div>
          <div class="iv-tags"></div>
          <div class="iv-actions"><button class="iv-copy">复制提示词</button><button class="iv-copyfull ghost">复制含前缀</button><button class="iv-copyzh ghost">复制中文对照</button></div>
        </div>
        <div class="iv-block">
          <div class="iv-label">Negative</div>
          <pre>${NEG}</pre>
          <div class="iv-actions"><button class="iv-copyneg ghost">复制负向</button></div>
        </div>
        <div class="iv-note">前缀（可选）：${PREFIX}。写实模型可改用 photorealistic, 35mm photo。<br>提示词只描述姿势/服装/发型，人物与画风请自行替换。</div>
        <div class="iv-block"><a href="${v.url}" target="_blank" rel="noopener">在 X 查看原帖 ↗</a></div>
      </div>
    </div>`;
  $('.iv-prompt', iv).textContent = it.prompt || '';
  const DIC = window.MIO_TAGDICT || {};
  const toks = (it.prompt || '').split(',').map(s=>s.trim()).filter(Boolean);
  const zhSentence = it.prompt_zh || toks.map(t=>DIC[t.toLowerCase()]||t).join('，');
  $('.iv-promptzh span', iv).textContent = zhSentence;
  const tagsEl = $('.iv-tags', iv);
  toks.forEach(t=>{
    const sp = document.createElement('span'); sp.className = 'iv-tag';
    const em = document.createElement('em'); em.textContent = t;
    sp.appendChild(em); sp.appendChild(document.createTextNode(DIC[t.toLowerCase()] || '—'));
    tagsEl.appendChild(sp);
  });
  $('.iv-copy', iv).onclick=e=>copyText(it.prompt||'', e.target, '复制提示词');
  $('.iv-copyfull', iv).onclick=e=>copyText(PREFIX+', '+(it.prompt||''), e.target, '复制含前缀');
  $('.iv-copyzh', iv).onclick=e=>copyText(zhSentence, e.target, '复制中文对照');
  $('.iv-copyneg', iv).onclick=e=>copyText(NEG, e.target, '复制负向');
  $('.ivclose', iv).onclick=()=>iv.classList.remove('open');
  iv.classList.add('open');
}
$('#itemview').onclick=e=>{ if(e.target.id==='itemview') e.currentTarget.classList.remove('open'); };

function lightbox(src,alt){
  const lb=$('#lightbox'); $('img',lb).src=src; $('img',lb).alt=alt||''; lb.classList.add('open');
}
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('open');

$('#seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.series=b.dataset.series;
  [...$('#seg').children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});
$('#q').addEventListener('input',e=>{ state.q=e.target.value; render(); });
$('#viewswitch').onclick=()=>{ state.mode = state.mode==='volumes'?'flat':'volumes'; render(); const y=document.querySelector('main').offsetTop - document.querySelector('.toolbar').offsetHeight - 8; window.scrollTo({top:Math.max(0,y), behavior:'smooth'}); };

render();
</script>
</body>
</html>
